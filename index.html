<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SheetFilter Wizard</title>

    <!-- PWA -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0b0f19" id="meta-theme-color">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="SheetFilter">
    <link rel="apple-touch-icon" href="icon-192.png">
    <meta name="description" content="Merge administrative data into your sheet, then filter it — works offline, nothing leaves your device.">

    <link rel="stylesheet" href="style.css">
    <!-- Assuming you are using SheetJS in your project -->
    <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
</head>
<body>
    <!-- Toast Notification for Warnings -->
    <div id="toast" class="toast hidden">
        <span class="toast-icon">⚠️</span>
        <span id="toast-message">Warning: Schools could not be matched.</span>
    </div>

    <div class="app-container">
        <!-- ========================================== -->
        <!-- SCREEN 1: DATA APPENDER (NEW FEATURE)      -->
        <!-- ========================================== -->
        <main id="screen-1" class="screen active">
            <div class="glass-panel">
                <header class="panel-header">
                    <div class="glow-orb"></div>
                    <h2>Data Merger</h2>
                    <p>Map and append administrative data to your sheet.</p>
                </header>

                <div class="form-group">
                    <label for="excel-upload">1. Upload Excel File</label>
                    <input type="file" id="excel-upload" accept=".xlsx, .xls, .csv" class="futuristic-input">
                </div>

                <div class="grid-2-col">
                    <div class="form-group">
                        <label for="header-row">Header Row Number</label>
                        <input type="number" id="header-row" value="1" min="1" class="futuristic-input">
                    </div>

                    <div class="form-group">
                        <label for="excel-column">2. Excel Column to Match</label>
                        <select id="excel-column" class="futuristic-input">
                            <option value="" disabled selected>Select column from sheet...</option>
                            <!-- Options injected via JS after upload -->
                        </select>
                    </div>
                </div>

                <div class="grid-2-col">
                    <div class="form-group">
                        <label for="base-column">3. Base Data Column</label>
                        <select id="base-column" class="futuristic-input">
                            <option value="s_emis_code" selected>EMIS Code (s_emis_code)</option>
                            <option value="s_id">School ID (s_id)</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>4. Columns to Append</label>
                        <div class="custom-multi-select">
                            <div class="select-box futuristic-input" id="multi-select-box">
                                <span id="multi-select-text">Select columns...</span>
                                <span class="arrow">▼</span>
                            </div>
                            <div class="dropdown-options glass-panel hidden" id="multi-select-dropdown">
                                <label class="checkbox-container">District (d_name)
                                    <input type="checkbox" value="d_name" class="append-cb">
                                    <span class="checkmark"></span>
                                </label>
                                <label class="checkbox-container">Tehsil (t_name)
                                    <input type="checkbox" value="t_name" class="append-cb">
                                    <span class="checkmark"></span>
                                </label>
                                <label class="checkbox-container">Markaz (m_name)
                                    <input type="checkbox" value="m_name" class="append-cb">
                                    <span class="checkmark"></span>
                                </label>
                                <label class="checkbox-container">Wing (w_name)
                                    <input type="checkbox" value="w_name" class="append-cb">
                                    <span class="checkmark"></span>
                                </label>
                                <label class="checkbox-container">Level (s_level)
                                    <input type="checkbox" value="s_level" class="append-cb">
                                    <span class="checkmark"></span>
                                </label>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="action-bar">
                    <button id="btn-merge" class="btn-primary futuristic-btn">
                        <span class="btn-text">Merge & Continue</span>
                        <span class="btn-glow"></span>
                    </button>
                </div>
            </div>
        </main>

        <!-- ========================================== -->
        <!-- SCREEN 2: FILTER TOOL (fed by merged data) -->
        <!-- ========================================== -->
        <main id="screen-2" class="screen">
            <div class="glass-panel">
                <header class="panel-header">
                    <div class="glow-orb pulse"></div>
                    <h2>Sheet Filter</h2>
                    <p id="file-meta">Filter your merged data dynamically.</p>
                </header>

                <div class="form-group">
                    <label>Filter rules</label>
                    <div id="err-filter" class="msg-err"></div>
                    <div id="filter-rows"></div>
                    <div class="filter-footer">
                        <button id="btn-add-filter" class="btn-secondary futuristic-btn btn-small" type="button">＋ Add filter</button>
                        <div class="logic-toggle">
                            <button class="logic-btn active" data-logic="and" id="logic-and" type="button">AND</button>
                            <button class="logic-btn" data-logic="or" id="logic-or" type="button">OR</button>
                        </div>
                        <span class="logic-hint">match condition</span>
                    </div>
                </div>

                <div class="action-bar space-between">
                    <button id="btn-back" class="btn-secondary futuristic-btn">
                        <span class="btn-text">Back to Merger</span>
                    </button>
                    <button id="btn-apply" class="btn-primary futuristic-btn">
                        <span class="btn-text">Apply Filters →</span>
                        <span class="btn-glow"></span>
                    </button>
                </div>

                <div id="results-section" class="results-section hidden">
                    <div class="stats-row">
                        <div class="stat-card">
                            <div class="val" id="stat-total">—</div>
                            <div class="lbl">Total rows</div>
                        </div>
                        <div class="stat-card">
                            <div class="val" id="stat-match">—</div>
                            <div class="lbl">Matching</div>
                        </div>
                        <div class="stat-card">
                            <div class="val" id="stat-pct">—</div>
                            <div class="lbl">Kept</div>
                        </div>
                    </div>
                    <div id="active-filters-tag" class="tag-row"></div>
                    <div id="table-container" class="table-container"></div>

                    <div id="download-section" class="download-section hidden">
                        <div class="filename-preview">
                            <span class="fn-label">filename:</span>
                            <span class="fn-value" id="fn-display">—</span>
                            <button class="fn-edit" id="fn-edit-btn" type="button">✎ rename</button>
                        </div>
                        <div class="filename-edit-row" id="fn-edit-row">
                            <input type="text" id="fn-input" class="futuristic-input" placeholder="custom filename (no extension)">
                            <button id="fn-save-btn" class="btn-primary futuristic-btn btn-small" type="button">Save</button>
                        </div>
                        <div class="dl-grid">
                            <button class="btn-primary futuristic-btn" id="btn-dl-xlsx" type="button">📥 Download .xlsx</button>
                            <button class="btn-secondary futuristic-btn" id="btn-dl-csv" type="button">📄 Download .csv</button>
                        </div>
                        <p class="privacy-note">File is built in your browser. No data is sent anywhere.</p>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="app.js"></script>
</body>
</html>
